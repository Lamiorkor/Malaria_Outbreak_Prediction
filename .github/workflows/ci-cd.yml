# ──────────────────────────────────────────────────────────────────────────────
# CI/CD Pipeline – Malaria Outbreak Prediction
#
# ──────────────────────────────────────────────────────────────────────────────
name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Environment variables shared by every job
env:
  PYTHON_VERSION: "3.11"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/malaria-api   # → ghcr.io/<owner>/<repo>/malaria-api

# Cancel duplicate runs on the same branch (saves CI minutes)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # CI JOB — runs on a clean Ubuntu VM and proves the code is healthy
  # ──────────────────────────────────────────────────────────────────────────
  test:
    name: CI – Lint & Unit Tests
    runs-on: ubuntu-latest

    steps:
      # Step 1: Pull the repository contents onto the runner
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Install Python (clean environment — no leftover packages)
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      # Step 3: Install project + test dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      # Step 4: Static check – fail fast if Python won't even parse
      - name: Syntax check
        run: |
          python -m compileall -q training_pipeline dockerisation_and_deployment

      # Step 5: Run the unit tests (the CI gate)
      - name: Run pytest
        run: |
          pytest -v --tb=short --maxfail=1

      # Step 6: Upload pytest report as artifact for inspection
      # - name: Upload test report
      #   if: always()                       # also runs on failure
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: pytest-report
      #     path: |
      #       .pytest_cache/
      #     retention-days: 7

      - name: Run pytest
        run: pytest -v --junitxml=pytest-report.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: pytest-report.xml


  # ──────────────────────────────────────────────────────────────────────────
  # CD JOB — builds and (conditionally) publishes the Docker image
  # ──────────────────────────────────────────────────────────────────────────
  build-and-push:
    name: CD – Build & Push Docker Image
    needs: test                                       # never run if CI fails
    runs-on: ubuntu-latest

    # Only push images for pushes to main; PRs only build locally to verify
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Lower-case the image name (GHCR requires lower-case repository paths)
      - name: Normalise image name
        id: img
        run: echo "name=${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"

      # Buildx gives layer caching and multi-arch support
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Authenticate with GHCR using the auto-provided GITHUB_TOKEN
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Compute meaningful tags: branch name, commit SHA, "latest" on main
      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.img.outputs.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      # The actual build. Pushes only on direct pushes (not on PRs from forks).
      - name: Build (and push if main) Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dockerisation_and_deployment/webservices/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Smoke test: start the container locally and check the /health endpoint
      - name: Smoke-test the image
        if: github.event_name == 'push'
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ steps.img.outputs.name }}:latest"
          docker pull "$IMAGE"
          docker run -d --rm --name malaria-api -p 8000:8000 \
            -e DISABLE_DB_LOGGING=true \
            "$IMAGE"
          # wait for FastAPI lifespan (model load) to finish
          for i in {1..15}; do
            if curl -fsS http://localhost:8000/ >/dev/null; then
              echo "✓ Container is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "✗ Container failed to become healthy"
          docker logs malaria-api
          exit 1

      - name: Stop smoke-test container
        if: always() && github.event_name == 'push'
        run: docker stop malaria-api || true
