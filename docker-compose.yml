# ──────────────────────────────────────────────────────────────────────────────
# docker-compose.yml — local deployment of the malaria stack.
#
# This file is the "Final Architecture" slide turned into runnable infra:
#
#       GitHub  →  CI  →  CD  →  Registry
#                                   │
#                       ┌───────────┼────────────┐
#                       ▼           ▼            ▼
#                   malaria-api   mlflow      postgres
#                       │           ▲
#                       └───────────┘
#                  (API logs / can load from MLflow)
#
# Usage:
#   docker compose up --build       # start everything
#   docker compose down             # stop everything
#
# Note: this is for local end-to-end testing.  In production each service
# would live in its own deployment (Kubernetes, ECS, …).
# ──────────────────────────────────────────────────────────────────────────────

services:

  # ──────────────────────────────────────────────────────────────────────
  # MLflow tracking server — model registry + experiment store
  # ──────────────────────────────────────────────────────────────────────
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.18.0
    container_name: malaria-mlflow
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/mlflow/mlruns
      - ./mlflow.db:/mlflow/mlflow.db
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/mlruns
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────────────────────────────────
  # Postgres — used by main.py for prediction logging
  # ──────────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: malaria-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: example
      POSTGRES_DB: test
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────────────────────────────────
  # The malaria prediction API — image built by the CD pipeline.
  # During local dev, build it from the Dockerfile in this repo.
  # ──────────────────────────────────────────────────────────────────────
  malaria-api:
    build:
      context: .
      dockerfile: dockerisation_and_deployment/webservices/Dockerfile
    image: malaria-api:local
    container_name: malaria-api
    ports:
      - "8000:8000"
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MODEL_DIR: /app/models
      DB_HOST: postgres
      DB_PORT: 5432               # internal port, not the host-mapped 5433
      DB_NAME: test
      DB_USER: postgres
      DB_PASSWORD: example
    depends_on:
      mlflow:
        condition: service_healthy
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
