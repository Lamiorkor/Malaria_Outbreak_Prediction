# ──────────────────────────────────────────────────────────────────────────────
# pytest.ini — single source of truth for test configuration
#
# Why this exists:
#   * Without it, pytest discovers ANY file matching test_*.py — including
#     the old `test_predict.py` that needs the real model artefacts and a
#     running database, which would break the CI run.
#   * `testpaths` pins discovery to the dedicated `tests/` folder so the CI
#     only runs the lightweight dummy-model tests (Dummy Model Concept,
#     slide 11 of the SW10 deck).
# ──────────────────────────────────────────────────────────────────────────────
[pytest]
minversion = 7.0
testpaths = tests
pythonpath =
    .
    dockerisation_and_deployment/webservices
    training_pipeline
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -ra
    --strict-markers
    --strict-config
markers =
    integration: tests that require model artefacts or external services
    unit: fast tests with no I/O
filterwarnings =
    ignore::DeprecationWarning
